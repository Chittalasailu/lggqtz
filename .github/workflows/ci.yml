name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Vercel requirements match backend (minus uvicorn)
        run: diff <(grep -v '^uvicorn' requirements.txt) <(grep -v '^#' ../requirements.txt)
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t windsight .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name ws windsight
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf "localhost:8000/api/decision?decision_date=2026-01-15" | head -c 300
